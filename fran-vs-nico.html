<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kahoot - Fran vs Nico</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #1e1e2f;
    color: #fff;
    margin: 0;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; font-size: 1.6em; }
  #contador {
    font-size: 4em;
    margin: 20px 0;
    color: #ffd700;
  }
  .nombres {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .nombre {
    font-size: 1.8em;
    padding: 50px 40px;
    border-radius: 20px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s, background 0.2s;
    flex: 1 1 200px;
    max-width: 300px;
  }
  .nombre:active { transform: scale(0.95); }
  .fran { background: #e74c3c; }
  .nico { background: #3498db; }
  .puntos {
    font-size: 1.2em;
    margin-top: 15px;
    color: #fff;
  }
  #reiniciar {
    margin-top: 40px;
    padding: 14px 28px;
    font-size: 1.1em;
    background: #2ecc71;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #reiniciar:hover { background: #27ae60; }

  @media (max-width: 480px) {
    body { padding: 10px; }
    h1 { font-size: 1.3em; }
    #contador { font-size: 3em; }
    .nombres { gap: 15px; }
    .nombre {
      font-size: 1.5em;
      padding: 40px 20px;
      flex: 1 1 100%;
      max-width: 100%;
    }
  }
</style>
</head>
<body>
  <h1>Kahoot - Fran vs Nico</h1>
  <div id="contador">0</div>
  <div class="nombres">
    <div class="nombre fran" id="fran">
      Fran
      <div class="puntos" id="puntosFran">0</div>
    </div>
    <div class="nombre nico" id="nico">
      Nico
      <div class="puntos" id="puntosNico">0</div>
    </div>
  </div>
  <button id="reiniciar">Reiniciar</button>

<script>
  let puntosFran = 0;
  let puntosNico = 0;
  let total = 0;

  const contadorEl = document.getElementById('contador');
  const puntosFranEl = document.getElementById('puntosFran');
  const puntosNicoEl = document.getElementById('puntosNico');

  document.getElementById('fran').addEventListener('click', () => {
    puntosFran++;
    total++;
    puntosFranEl.textContent = puntosFran;
    contadorEl.textContent = total;
  });

  document.getElementById('nico').addEventListener('click', () => {
    puntosNico++;
    total++;
    puntosNicoEl.textContent = puntosNico;
    contadorEl.textContent = total;
  });

  document.getElementById('reiniciar').addEventListener('click', () => {
    puntosFran = 0;
    puntosNico = 0;
    total = 0;
    puntosFranEl.textContent = 0;
    puntosNicoEl.textContent = 0;
    contadorEl.textContent = 0;
  });
</script>
</body>
</html>
